robot:
  type: so100
  calibration_dir: .cache/calibration/so100
  max_relative_target: null
  leader_arms:
    main:
      type: feetech
      port: /dev/ttyACM1
      motors:
        shoulder_pan: [1, "sts3215"]
        shoulder_lift: [2, "sts3215"]
        elbow_flex: [3, "sts3215"]
        wrist_flex: [4, "sts3215"]
        wrist_roll: [5, "sts3215"]
        gripper: [6, "sts3215"]
      mock: false
  follower_arms:
    main:
      type: feetech
      port: /dev/ttyACM0
      motors:
        shoulder_pan: [1, "sts3215"]
        shoulder_lift: [2, "sts3215"]
        elbow_flex: [3, "sts3215"]
        wrist_flex: [4, "sts3215"]
        wrist_roll: [5, "sts3215"]
        gripper: [6, "sts3215"]
      mock: false
  cameras: {}
  mock: false

control:
  type: teleoperate
